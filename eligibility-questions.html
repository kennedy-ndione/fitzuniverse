<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarBridge | Questionnaire</title>

<meta name="description" content="Répondez à 10 questions pour recevoir une analyse ScholarBridge personnalisée de votre profil, réalisée par Fitz.">

<meta name="theme-color" content="#12162E">

<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png">

<!-- URL à mettre à jour si un nom de domaine personnalisé est acheté -->
<link rel="canonical" href="https://scholarbridge-e0d84.web.app/eligibility-questions.html">

<meta property="og:title" content="ScholarBridge | Questionnaire">
<meta property="og:description" content="Répondez à 10 questions pour recevoir une analyse ScholarBridge personnalisée de votre profil, réalisée par Fitz.">
<meta property="og:type" content="website">
<!-- URL à mettre à jour si un nom de domaine personnalisé est acheté (scholarbridge-e0d84.web.app = domaine Firebase Hosting par défaut) -->
<meta property="og:image" content="https://scholarbridge-e0d84.web.app/assets/images/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ScholarBridge | Questionnaire">
<meta name="twitter:description" content="Répondez à 10 questions pour recevoir une analyse ScholarBridge personnalisée de votre profil, réalisée par Fitz.">

<!-- Google Fonts — système typographique Fitz (voir
css/eligibility-typography.css), même identité que
index.html/universities.html/scholarships.html. Remplace Inter/Sora
("identiques à index.html" jusqu'au 2026-08-14 — devenu faux dès que
index.html est passé à cette pile, voir eligibility-test.html pour le
détail). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Design system ScholarBridge (mêmes variables, mêmes couleurs que index.html) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/ai-suite.css">
<link rel="stylesheet" href="eligibility-questions.css">
<!-- Chargé en dernier : doit gagner la cascade sur les font-family
déclarés dans eligibility-questions.css. -->
<link rel="stylesheet" href="css/eligibility-typography.css">
</head>

<body>

<div class="container">

<!-- Badge -->
<div class="fitz-badge">
<i data-lucide="bot"></i>
<span>Fitz</span>
</div>

<!-- Barre de progression -->
<div class="progress-info">
<span id="questionNumber">Question 1 / 10</span>
<span id="progressPercent">10%</span>
</div>

<div class="progress">
<div class="progress-bar" id="progressBar" style="width: 10%;"></div>
</div>

<!-- Conversation -->
<div class="chat-box">
<div class="fitz-avatar">
<i data-lucide="sparkles"></i>
</div>
<div class="assistant-bubble">
<div class="assistant-message" id="assistantMessage">
Bonjour ! Commençons par savoir où vous vivez actuellement.
</div>
<p class="fitz-status" id="fitzHint">Fitz apprend à connaître votre profil…</p>
</div>
</div>

<!-- Question -->
<div class="question-header">
<span class="question-icon" id="questionIcon"></span>
<h2 id="question">Dans quel pays vivez-vous actuellement ?</h2>
</div>

<label for="answer" class="visually-hidden">Votre réponse</label>

<!-- Réponse texte / recherche -->
<div id="textContainer">
<input type="text" id="answer" autocomplete="off" placeholder="Commencez à taper..." aria-label="Votre réponse">
<div id="suggestions" class="suggestions" role="listbox"></div>
</div>

<!-- Cartes de choix (cachées par défaut) -->
<div id="cardsContainer" class="cards-container" style="display:none;"></div>

<!-- Sélecteur d'échelle (moyenne académique — question "average") :
puces générées par eligibility-questions.js depuis question.scales
(questions.js), une pour /20, /100, GPA /4, Lettres (A-F), Autre. -->
<div id="scaleSelector" class="scale-selector" style="display:none;"></div>

<!-- Curseur (caché par défaut, utilisé pour la moyenne académique dans
les échelles numériques — /20, /100, GPA /4, Autre) -->
<div id="sliderContainer" class="slider-container" style="display:none;">
<output id="sliderValue">10</output>
<input type="range" id="sliderInput" aria-label="Votre moyenne générale">
</div>

<!-- Boutons de lettres (échelle "Lettres (A-F)" uniquement) -->
<div id="lettersContainer" class="letters-container" style="display:none;"></div>

<!-- Bouton -->
<div class="nav-buttons">
<button id="backButton" type="button" class="back-button" aria-label="Question précédente">
<i data-lucide="arrow-left"></i>
<span>Retour</span>
</button>
<button id="nextButton" type="button">
<span>Continuer</span>
<i data-lucide="arrow-right"></i>
</button>
</div>

</div>

<script src="questions.js"></script>
<script src="eligibility.engine.js"></script>
<!-- module (audit du 2026-08-14) : lit une liste de pays réelle depuis
Firestore avant le 1er rendu (voir loadDestinationCountries) — voir le
commentaire en tête de eligibility-questions.js pour pourquoi QUESTIONS/
EligibilityEngine (scripts classiques ci-dessus) restent accessibles
malgré la conversion. -->
<script type="module" src="eligibility-questions.js"></script>
<script>
if (window.lucide) lucide.createIcons();
</script>

</body>
</html>

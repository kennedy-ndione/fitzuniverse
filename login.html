<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>Se connecter | FitzUniverse</title>

<!-- Audit 2026-09-01 : theme-color aligné sur le standard du site. -->
<meta name="theme-color" content="#211D18">

<meta name="description" content="Connectez-vous à votre espace FitzUniverse pour retrouver votre diagnostic et poursuivre votre accompagnement.">

<!-- Pas de mode sombre : le design "papier chaud" est clair par choix
(la carte de cette page est sombre, mais ses couleurs sont calibrées —
un assombrissement automatique casserait les contrastes). -->
<meta name="color-scheme" content="light">

<!-- Page de connexion : rien d'utile à indexer. -->
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png">

<!-- Google Fonts (identiques au reste du parcours) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Newsreader + Public Sans depuis le 2026-08-30 — même identité
« éditorial chaleureux » que le reste du parcours (voir
css/login-redesign.css). Remplace Plus Jakarta Sans/Space Grotesk. -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Lucide Icons -->
<!-- Version FIGÉE et `defer` (2026-08-30) — même correctif que sur le
reste du site : tout createIcons() de script classique doit attendre
DOMContentLoaded. -->
<script src="https://unpkg.com/lucide@1.31.0" defer></script>

<!-- Design system Fitz -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="auth.css">
<!-- Chargée en dernier : identité « papier chaud » de cette page (remap
des tokens + carte encre chaude), voir le commentaire en tête. -->
<link rel="stylesheet" href="css/login-redesign.css">

</head>

<body>

<!-- Lien d'évitement (audit 2026-09-01) — même composant que les pages
publiques (.skip-link, css/base.css) ; tabindex="-1" sur <main> pour
que l'Entrée DÉPLACE réellement le focus (voir la note d'index.html). -->
<a href="#main-content" class="skip-link">Aller au contenu</a>

<!-- Refonte "carte flottante sur photo plein écran" (2026-08-13),
référence pages de connexion institutionnelles (SSO universitaire) :
amphitheatre.jpg en fond plein écran fixe (même technique que
.hero-media, css/hero.css), voile dégradé bleu marine par-dessus,
carte blanche opaque (pas de verre translucide : le texte doit rester
lisible quelle que soit la photo derrière, pas seulement "probablement
assez sombre"). .auth-shell/.auth-hero/.auth-badge de l'ancienne mise
en page à 2 blocs empilés ont disparu — logo/titre rejoignent
directement la carte. payment.html charge aussi auth.css mais n'utilise
aucune de ces classes (.auth-page/.auth-shell/.auth-hero/.auth-card),
seulement les classes de champs de formulaire plus bas dans ce fichier
(.input-group, .password-grid, etc.) — non affecté par cette refonte. -->
<main id="main-content" tabindex="-1" class="auth-page">

<img
class="auth-page-bg"
src="assets/images/amphitheatre-1920w.jpg"
srcset="assets/images/amphitheatre-400w.jpg 400w, assets/images/amphitheatre-800w.jpg 800w, assets/images/amphitheatre-1200w.jpg 1200w, assets/images/amphitheatre-1920w.jpg 1920w"
sizes="100vw"
fetchpriority="high"
alt="">

<div class="auth-page-overlay" aria-hidden="true"></div>

<!-- Retour vers l'accueil (audit mobile 2026-09-01) : cette page
n'offrait AUCUN chemin de sortie — ni en-tête, ni logo cliquable ;
les seuls liens étaient « Mot de passe oublié ? » et « Choisir ma
formule ». Doctrine regles_mobile.md : une navigation de sortie
toujours visible sur chaque page. Pastille posée SUR la photo
(au-dessus du voile, voir .auth-back-link dans login-redesign.css),
même grammaire flèche+libellé que les .back-link du site. -->
<a href="index.html" class="auth-back-link">
<i data-lucide="arrow-left" aria-hidden="true"></i>
<span>Accueil</span>
</a>

<!-- Carte -->
<div class="auth-card reveal">

<!-- on-dark : la carte est encre (login-redesign.css) — la structure du
symbole passe en papier ; l'arc ambre, lui, ne change jamais. -->
<div class="auth-logo-wrap on-dark">
<svg class="fitz-mark logo-icon" viewBox="0 0 100 100" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg"><circle class="mark-structure" cx="50" cy="50" r="34" stroke-width="11" stroke-linecap="round" stroke-dasharray="130 83.6" transform="rotate(-90 50 50)"/><circle class="mark-accent" cx="50" cy="50" r="34" stroke-width="11" stroke-linecap="round" stroke-dasharray="42 171.6" stroke-dashoffset="-150" transform="rotate(-90 50 50)"/></svg>
</div>

<!-- Titre et sous-titre ÉCRITS PAR LE JS (voir login.js, applyGreeting).
Le contenu ci-dessous est celui du visiteur INCONNU : c'est le cas par
défaut, et c'est volontaire. « Bon retour parmi nous » s'affichait à
tout le monde — y compris à quelqu'un qui découvrait le site et qui
n'était jamais « revenu » nulle part. Une page qui salue un inconnu
comme un habitué se trompe sur la personne à la première phrase.

Le message chaleureux n'est pas supprimé : il est rendu à ceux à qui
il s'adresse vraiment, ceux dont on garde une trace de connexion.
Rendu sans JS : le visiteur voit la formulation neutre, qui est vraie
pour tout le monde. Jamais l'inverse. -->
<h1 id="authTitle">Connectez-vous à votre espace</h1>
<p class="auth-card-subtext" id="authSubtext">Retrouvez votre diagnostic, vos candidatures et votre accompagnement avec Fitz.</p>

<!-- Affiché uniquement quand un prénom est reconnu : indispensable sur
un ordinateur partagé (cybercafé, poste familial), où saluer
quelqu'un d'autre par son prénom est au mieux gênant. -->
<button type="button" class="auth-not-you" id="authNotYou" hidden>Ce n'est pas vous ?</button>

<form id="loginForm" class="login-form">

<div class="input-group">

<label for="signupEmail">Adresse e-mail</label>

<div class="input-wrap">
<i data-lucide="mail" class="input-icon"></i>
<input
type="email"
id="signupEmail"
placeholder="vous@exemple.com"
autocomplete="email"
required>
</div>

</div>

<div class="input-group">

<label for="signupPassword">Mot de passe</label>

<div class="input-wrap has-toggle">

<i data-lucide="lock" class="input-icon"></i>

<input
type="password"
id="signupPassword"
placeholder="Votre mot de passe"
autocomplete="current-password"
required>

<button
type="button"
id="togglePassword"
class="password-toggle"
aria-label="Afficher le mot de passe"
aria-pressed="false">
<i data-lucide="eye"></i>
</button>

</div>

</div>

<div class="auth-options">

<!-- Coché par défaut : c'est l'attente sur son propre appareil, et
c'est ce qui permet à la page de saluer la personne par son prénom
au retour (voir login.js). Décoché, rien n'est conservé — ni
session persistante, ni prénom, ni adresse. -->
<label class="remember-me">
<input type="checkbox" id="rememberMe" checked>
<span>Se souvenir de moi</span>
</label>

<a href="#" class="forgot-link" id="forgotPasswordLink">Mot de passe oublié ?</a>

</div>

<button type="submit" class="btn-auth-submit">
Se connecter
</button>

<p class="forgot-note" id="forgotPasswordNote" hidden></p>

</form>

<div class="auth-trust">
<i data-lucide="shield-check"></i>
<span>Connexion sécurisée</span>
</div>

<p class="login-link">
Votre compte se crée avec votre première formule.
<a href="offers.html">Choisir ma formule</a>
</p>

</div>

</main>

<script>

// Bascule d'affichage du mot de passe — logique strictement inchangée.
const togglePassword = document.getElementById("togglePassword");
const passwordInput = document.getElementById("signupPassword");

if (togglePassword && passwordInput) {

togglePassword.addEventListener("click", () => {

const isHidden = passwordInput.type === "password";

passwordInput.type = isHidden ? "text" : "password";

togglePassword.innerHTML = `<i data-lucide="${isHidden ? "eye-off" : "eye"}"></i>`;
if (window.lucide) lucide.createIcons();

togglePassword.setAttribute("aria-pressed", String(isHidden));

togglePassword.setAttribute(
"aria-label",
isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe"
);

});

}

</script>

<script>

// Améliorations UX purement décoratives (mémorisation de l'e-mail,
// notice "mot de passe oublié", apparition au chargement, icônes).
// Aucun appel Firebase ici : login.js reste seul responsable de
// l'authentification, de la validation et de la redirection.
(function () {

const REMEMBER_KEY = "scholarbridge_remembered_email";
const emailInput = document.getElementById("signupEmail");
const rememberCheckbox = document.getElementById("rememberMe");
const loginForm = document.getElementById("loginForm");

if (emailInput && rememberCheckbox && loginForm) {

const remembered = localStorage.getItem(REMEMBER_KEY);

if (remembered) {
emailInput.value = remembered;
rememberCheckbox.checked = true;
}

loginForm.addEventListener("submit", () => {

if (rememberCheckbox.checked) {
localStorage.setItem(REMEMBER_KEY, emailInput.value.trim());
} else {
localStorage.removeItem(REMEMBER_KEY);
}

});

}

// La logique du lien "Mot de passe oublié ?" vit désormais dans
// login.js (envoi d'un vrai e-mail de réinitialisation Firebase),
// pas ici — ce script reste purement décoratif (voir commentaire
// en tête de fichier).

document.documentElement.classList.add("js-ready");

const revealEls = document.querySelectorAll(".reveal");

if ("IntersectionObserver" in window) {

const observer = new IntersectionObserver((entries) => {

entries.forEach((entry) => {
if (entry.isIntersecting) {
entry.target.classList.add("is-visible");
observer.unobserve(entry.target);
}
});

}, { threshold: 0.1 });

revealEls.forEach((el) => observer.observe(el));

} else {

revealEls.forEach((el) => el.classList.add("is-visible"));

}

// lucide est chargé avec `defer` : au moment où ce script classique
// s'exécute, la librairie n'est pas encore là — attendre
// DOMContentLoaded (même piège que sur offers.js, corrigé le
// 2026-08-29).
document.addEventListener("DOMContentLoaded", () => {
if (window.lucide) lucide.createIcons();
});

})();

</script>

<script type="module" src="login.js"></script>

<!-- Lot PIED-DE-PAGE (2026-09-10) : PAS de pied de page ici — cette page
n'a qu une tâche, elle n'offre pas six façons de partir. Le glossaire
(js/glossaire.js) reste : js/glossaire-seul.js le lance sans le pied de page. -->
<script src="js/glossaire-seul.js" defer></script>
</body>

</html>

<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">

<title>Ma route vers la France | FitzUniverse</title>

<meta name="description" content="Votre préinscription en France, une étape à la fois : de votre situation au visa, quinze étapes guidées sur la procédure officielle de votre pays.">

<meta name="theme-color" content="#211D18">
<!-- Pas de mode sombre : le design "papier chaud" est clair par choix. -->
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png">

<!-- Newsreader + Public Sans — l'identité « éditorial chaleureux » du
reste du site rejoint enfin l'espace étudiant (refonte du 2026-08-30,
voir css/journey-shell.css). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Version figée + defer — standard du site (tout createIcons() de
script classique attend DOMContentLoaded ; les modules sont sûrs). -->
<script src="https://unpkg.com/lucide@1.31.0" defer></script>
<script src="js/icones.js" defer></script>

<!-- Design system Fitz. app-shell.css/dashboard.css restent chargées
pour la cloche de messages, le loader et la pastille de formule ;
journey-shell.css (coquille sans sidebar + tokens chauds), journey.css
(les composants partagés) puis route.css (LA ROUTE, lot R1) les
surclassent — ordre significatif. -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="css/journey-shell.css">
<link rel="stylesheet" href="css/journey.css">
<link rel="stylesheet" href="css/guide.css">
<link rel="stylesheet" href="css/route.css">
<link rel="stylesheet" href="css/mobile-nav.css">
<style>[hidden]{display:none !important;}</style>

<script src="js/mobile-nav.js" defer></script>
</head>

<!-- data-espace : l'espace auquel CETTE page appartient. Lu par
     espace-preinscription.js (le moteur de la route) et posé à nouveau
     par bootstrapShell une fois la session résolue. -->
<body data-espace="preinscription">

<!-- Lien d'évitement (audit 2026-09-01) — même composant que les pages
publiques (.skip-link, css/base.css) ; tabindex="-1" sur <main> pour
que l'Entrée DÉPLACE réellement le focus (voir la note d'index.html). -->
<a href="#main-content" class="skip-link">Aller au contenu</a>

<!-- Loader affiché pendant la vérification de la session Firebase -->
<div id="pageLoader" class="auth-page-loader">
<div class="loader-spinner"></div>
</div>

<div class="dashboard-shell">

<div class="dashboard-main">

<!-- ==========================================================
BARRE HAUTE — remplace la sidebar (refonte du 2026-08-30).
La navigation de l'espace étudiant, c'est LE PARCOURS ci-dessous :
chaque outil s'ouvre depuis la phase qui lui donne un sens, jamais
depuis un inventaire de liens. Les identifiants (messagesBellBtn,
topbarPlanLabel, logoutBtn) sont conservés : js/app-shell.js et
js/student-messages.js les pilotent sans modification.
========================================================== -->
<header class="journey-topbar">

<a href="espace-preinscription.html" class="fitz-lockup" aria-label="FitzUniverse — ma préinscription">
<svg class="fitz-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
<circle class="mark-structure" cx="50" cy="50" r="34" stroke-width="11" stroke-linecap="round" stroke-dasharray="130 83.6" transform="rotate(-90 50 50)"/>
<circle class="mark-accent" cx="50" cy="50" r="34" stroke-width="11" stroke-linecap="round" stroke-dasharray="42 171.6" stroke-dashoffset="-150" transform="rotate(-90 50 50)"/>
</svg>
<span class="fitz-lockup-text">
<span class="fitz-lockup-name">Fitz</span>
<span class="fitz-lockup-sub">Universe</span>
</span>
</a>

<div class="journey-topbar-actions">

<div class="messages-bell-wrap">

<button type="button" class="messages-bell-btn" id="messagesBellBtn" aria-label="Messages" aria-expanded="false">
<i data-lucide="bell"></i>
<span class="messages-bell-dot" id="messagesBellDot" hidden></span>
</button>

<div class="messages-panel" id="messagesPanel" hidden>
<div class="messages-panel-header">Messages de l'équipe</div>
<div class="messages-panel-list" id="messagesPanelList"></div>
</div>

</div>

<a href="offers.html" class="topbar-plan-chip">
<span id="topbarPlanLabel">…</span>
</a>

<a href="profile.html" class="journey-top-icon journey-top-icon--secondary" title="Mon profil" aria-label="Mon profil">
<i data-lucide="user-round"></i>
</a>

<a href="account.html" class="journey-top-icon journey-top-icon--secondary" title="Paramètres" aria-label="Paramètres">
<i data-lucide="settings"></i>
</a>

<button type="button" id="logoutBtn" class="journey-top-icon" title="Déconnexion" aria-label="Déconnexion">
<i data-lucide="log-out"></i>
</button>

</div>

</header>

<main id="main-content" tabindex="-1" class="content" style="display:none;">

<!-- ==========================================================
LA ROUTE (lot R1, 2026-09-17) — « une route, une étape, un geste ».

Cette page ne montre qu'UNE étape à la fois : celle où l'étudiant en
est, ou celle qu'il a choisi de regarder. Le fil des quinze points en
haut dit la route entière sans la faire lire ; la liste du bas la
détaille par son seul nom. Tout le contenu est rendu par
espace-preinscription.js depuis js/route-preinscription.js (pur, testé)
et la procédure du pays de résidence (js/procedures/*).

Ce qu'il n'y a PLUS ici, à dessein : les six phases et leurs voiles, le
radar, la ligne de quota, les cartes d'opportunités, la boîte à outils.
Chaque outil Fitz s'ouvre depuis l'étape qui lui donne un sens — et
depuis elle seule.
========================================================== -->

<div class="rt-cockpit">

<header class="jy-hello rt-hello">
<h1 id="welcomeMessage">Bonjour</h1>
<p id="rtLigne">Chargement de votre route…</p>
<p class="rt-formule" id="rtFormule"></p>
</header>

<!-- Le fil : quinze points, un par étape. Cliquables : regarder une
étape à venir est toujours permis, rien n'est verrouillé. -->
<nav class="rt-fil" id="rtFil" aria-label="Les quinze étapes de votre route"></nav>
<div class="rt-barre" id="rtBarre" role="progressbar" aria-valuemin="0" aria-valuemax="15" aria-labelledby="rtBarreTexte">
<span class="rt-barre-remplie"></span>
<span class="rt-barre-texte" id="rtBarreTexte"></span>
</div>

</div>

<!-- L'étape affichée. -->
<section class="rt-etape" id="rtEtape" aria-live="polite"></section>

<!-- Les autres étapes, par leur nom. -->
<section class="rt-suite-bloc">
<h2 class="rt-suite-h">Toute la route</h2>
<ol class="rt-suite" id="rtSuite"></ol>
</section>

</main>

</div>

</div>

<script src="pricing-plans.js"></script>
<script type="module" src="espace-preinscription.js"></script>

<!-- Pastille « Control Center » : rendue UNIQUEMENT pour un compte
administrateur actif (voir js/admin-access.js) — invisible et
inexistante pour tout autre visiteur. -->
<script type="module" src="js/admin-access.js"></script>

</body>

</html>
